apiVersion: v1
kind: Config
current-context: dev-01
clusters:
  - name: charlie
    cluster:
      server: https://api.charlie.example.com
      insecure-skip-tls-verify: true
  - name: zulu
    cluster:
      server: https://api.zulu.example.com
      insecure-skip-tls-verify: true
contexts:
  - name: dev-01
    context:
      cluster: charlie
      user: oidc-alpha
      namespace: dev-01
  - name: dev-trading
    context:
      cluster: charlie
      user: oidc-alpha
      namespace: trading-service
  - name: cnc-prod
    context:
      cluster: zulu
      user: oidc-alpha
users:
  - name: oidc-alpha
    user:
      token: fake-token-for-tests
